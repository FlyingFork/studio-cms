services:
  migrate:
    image: registry/studio-cms:${TAG}
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    env_file: .env.production
    networks:
      - shared-db

  app:
    image: registry/studio-cms:${TAG}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
    env_file: .env.production
    volumes: [uploads:/app/uploads]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - shared-db
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: registry/studio-cms:${TAG}
    command: ["node_modules/.bin/tsx", "src/worker/index.ts"]
    env_file: .env.production
    volumes: [uploads:/app/uploads]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - shared-db

volumes:
  uploads:

networks:
  shared-db:
    external: true
